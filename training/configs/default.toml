# Default training recipe (design D11). Everything here is data: reward weights,
# curriculum and the time box change without touching GDScript or Python.

[run]
seed = 1
n_parallel = 4            # Godot processes, each with 8 rows (4 procs: ~4.6k agent steps/s, 8: ~8.4k on a 10-core M-series)
speedup = 8               # physics speedup passed to Godot
checkpoint_every = 250_000
time_box_hours = 8.0      # checked at phase boundaries and every rollout
rows = 8                  # Game rows per Godot process
# Snapshot opponents: TrainArena runs a frozen snapshot ONNX (exported at checkpoints) as the
# opponent through the in-game PolicyController. While no snapshot exists yet, or when false,
# the snapshot share of a phase is given to cpu_normal (a warning is printed).
snapshot_opponents = true

[ppo]
n_steps = 512
batch_size = 2048
n_epochs = 4
learning_rate = 3e-4
gamma = 0.995
gae_lambda = 0.95
ent_coef = 0.01
clip_range = 0.2
net_arch_pi = [64, 64]
net_arch_vf = [64, 64]

# Episode rules of every training row (BVS_TRAIN_CONFIG.match): a tied timer expiry goes to
# sudden death instead of ending the episode, and an episode whose sudden death lasts
# `sd_safety_cap` seconds is truncated as a draw (reason sd_cap, no win/loss/timeout reward).
[match]
sudden_death = true
sd_safety_cap = 60.0

# Fighter kits of the training rows (BVS_TRAIN_CONFIG.kits). `random` draws a kit (Rafael or
# Matilde) for each side of each row at build time and at every episode end, from a per-row
# generator seeded `seed * 1009 + row`, so both kits appear on both sides (mirrors included);
# `character` keeps the scene kits. `seed` defaults to run.seed.
[kits]
mode = "random"

# Reward overrides (data only). Keys are RewardConfig fields; see
# game/ai/training/reward_config.gd for the defaults. The combat-depth terms are signal-driven
# (pickups, food hits, shield breaks, a long shield hold); the last two keys are parameters.
[reward]
pickup = 0.35
food_hit = 0.15
shield_break_dealt = 0.4
shield_break_taken = -0.4
shield_hold = -0.003
shield_hold_threshold = 1.5   # seconds of continuous shielding before shield_hold applies
pickup_cap = 8                # rewarded pickups per episode
# Character-kits terms (signal driven): a small reward per extra hit of a combo I deal, capped per
# combo (combo_hit_cap extra hits) and per episode (combo_episode_cap), and a small cost per shield
# raise (the lever against shield spam; 0.0 in code, so a missing key changes nothing).
combo_hit = 0.04
combo_hit_cap = 4
combo_episode_cap = 1.0
shield_raise = -0.002

# Acceptance gates of the harness (training/bvs_training/harness.py). A retrained model only
# replaces the bundled one, and the playable schema only moves, when every gate passes.
[acceptance]
max_mean_sd_seconds = 45             # forced sudden death, model vs model
min_pickups_per_fighter_minute = 1.0 # regulation matches with the model
max_blocked_share = 0.70             # (blocked + broke) / (full + blocked + broke), bombs excluded
min_ko_win_rate_easy = 0.60          # model vs CPU Easy, won by KO
min_matches = 24                     # per matchup
min_matches_share = 40               # matchups that decide the kit shares (mvm, cpu_hard_vs_cpu_hard)
min_matches_forced_sd = 20           # forced sudden-death mvm
max_combo = 6                        # longest combo (hits), every matchup
max_hurt_seconds = 1.5               # longest continuous Hurt of any victim, every matchup
min_multi_hit_combos = 5             # 2+ hit combos per matchup (mvm, cpu_normal and cpu_hard mirrors)
kit_win_share_min = 0.40             # Rafael's win share band in mvm and the CPU Hard mirror
kit_win_share_max = 0.60
max_combo_damage_gap = 0.20          # abs(R - M) / max(R, M) of the mean multi-hit combo damage
# Shield raises per fighter-minute in mvm and m_vs_cpu_hard (design D15). Measured by
# `uv run python -m bvs_training.harness --baseline` at seed 1 with kits rm, before any retrain.
# Re-measured in S6 after the Rafael kit-data balance pass (D15): R_cpu 9.77 (CPU Hard mirror),
# R_old 5.83 (bundled schema 3 model), so 0.5 * R_old < R_cpu and T = max(1.5 * R_cpu, R_cpu + 2.0)
# = 14.66 (first measurement before the balance pass: 10.50, 5.85, 15.75; see reports/shield-baseline.md).
# Changed only by a new measurement that a report explains.
max_shield_raises_per_fighter_minute = 14.66
# Share of finished shield holds shorter than 15 ticks (0.25 s), in every matchup with the model
# (mvm, m_vs_cpu_*): the "shield tapped between other actions" pattern. CPU Hard's share is reported
# for information only.
max_shield_tap_share = 0.5

[[phase]]
name = "P1"
steps = 3_000_000
mix = { cpu_easy = 1.0 }

[[phase]]
name = "P2"
steps = 3_000_000
mix = { cpu_easy = 0.5, cpu_normal = 0.5 }
sd_start = 0.125   # share of rows that begin every episode in sudden death

[[phase]]
name = "P3"
steps = 4_000_000
mix = { cpu_normal = 0.3, cpu_easy = 0.2, self = 0.2, snapshot = 0.3 }
sd_start = 0.25
